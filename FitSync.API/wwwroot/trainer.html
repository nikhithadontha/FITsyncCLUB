<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitSync | Trainer Profile</title>
    <link rel="stylesheet" href="CSS/dashboard.css">
    <link rel="stylesheet" href="CSS/theme.css">
    <link rel="stylesheet" href="CSS/notification.css">
    <style>
        .trainer-profile-container {
            max-width: 860px;
            margin: 0 auto;
            padding: 40px 24px 80px;
        }
        .back-nav-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: rgba(240,246,252,0.6);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            padding: 8px 14px;
            border-radius: 8px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 32px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .back-nav-btn:hover {
            color: #06b6d4;
            border-color: rgba(6,182,212,0.35);
            background: rgba(6,182,212,0.07);
        }
        .trainer-hero {
            display: flex;
            gap: 32px;
            align-items: flex-start;
            background: rgba(22,27,34,0.9);
            border: 1px solid rgba(48,54,61,0.8);
            border-radius: 20px;
            padding: 36px;
            margin-bottom: 28px;
            position: relative;
            overflow: hidden;
        }
        .trainer-hero::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 80% 20%, rgba(6,182,212,0.06), transparent 60%);
            pointer-events: none;
        }
        .trainer-hero-avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(6,182,212,0.4);
            box-shadow: 0 0 30px rgba(6,182,212,0.2);
            flex-shrink: 0;
        }
        .trainer-hero-info { flex: 1; }
        .trainer-hero-info h1 {
            font-size: 28px;
            font-weight: 800;
            color: #f0f6fc;
            margin-bottom: 8px;
        }
        .trainer-spec-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(6,182,212,0.12);
            border: 1px solid rgba(6,182,212,0.3);
            color: #06b6d4;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 14px;
        }
        .trainer-meta-row {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .trainer-meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: rgba(240,246,252,0.65);
        }
        .trainer-meta-item strong { color: #f0f6fc; }
        .trainer-bio-text {
            font-size: 14px;
            line-height: 1.7;
            color: rgba(240,246,252,0.7);
            max-width: 500px;
        }
        .info-card {
            background: rgba(22,27,34,0.9);
            border: 1px solid rgba(48,54,61,0.8);
            border-radius: 16px;
            padding: 28px 32px;
            margin-bottom: 20px;
        }
        .info-card h2 {
            font-size: 16px;
            font-weight: 700;
            color: #f0f6fc;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 14px;
        }
        .stat-bubble {
            background: rgba(13,17,23,0.6);
            border: 1px solid rgba(48,54,61,0.6);
            border-radius: 12px;
            padding: 18px 16px;
            text-align: center;
        }
        .stat-bubble .stat-val {
            font-size: 24px;
            font-weight: 800;
            color: #06b6d4;
            display: block;
        }
        .stat-bubble .stat-lbl {
            font-size: 11px;
            color: rgba(240,246,252,0.5);
            font-weight: 600;
            margin-top: 4px;
            display: block;
        }
        .tags-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .skill-tag {
            background: rgba(6,182,212,0.08);
            border: 1px solid rgba(6,182,212,0.2);
            color: rgba(240,246,252,0.7);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .slot-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(13,17,23,0.6);
            border-radius: 10px;
            border: 1px solid rgba(48,54,61,0.5);
            margin-bottom: 8px;
            transition: border-color 0.2s;
        }
        .slot-row:hover { border-color: rgba(6,182,212,0.35); }
        .slot-row .slot-info {
            font-size: 13px;
            color: rgba(240,246,252,0.75);
        }
        .slot-row .slot-info strong { color: #f0f6fc; }
        .book-from-profile-btn {
            background: linear-gradient(135deg, #06b6d4, #0891b2);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 7px 18px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .book-from-profile-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(6,182,212,0.35);
        }
        .profile-loading {
            text-align: center;
            padding: 80px 20px;
            color: rgba(240,246,252,0.5);
            font-size: 15px;
        }
        @media (max-width: 600px) {
            .trainer-hero { flex-direction: column; align-items: center; text-align: center; }
            .trainer-meta-row { justify-content: center; }
            .trainer-bio-text { max-width: 100%; }
        }
    </style>
</head>
<body>
    <header class="navbar">
        <a href="index.html" class="logo">Fit<span>Sync</span></a>
        <nav>
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="workout.html?category=Strength">Workouts</a>
            <a href="diet.html">Diet Plan</a>
            <a href="progress.html">Progress</a>
            <a href="profile.html">Profile</a>
            <a href="admin.html" id="adminNavLink" style="display:none;">Admin</a>
        </nav>
        <button id="logoutBtn" class="logout-btn">Logout</button>
    </header>

    <div class="trainer-profile-container">
        <button class="back-nav-btn" id="backBtn" onclick="goBack()">← Back to Home</button>
        <div id="profileContent">
            <div class="profile-loading">Loading trainer profile...</div>
        </div>
    </div>

    <script src="JS/theme.js"></script>
    <script src="JS/notification.js"></script>
    <script>
        function goBack() {
            const returnPage = sessionStorage.getItem('trainerReturnPage');
            if (returnPage) {
                window.location.href = returnPage;
            } else if (document.referrer && document.referrer !== window.location.href) {
                window.location.href = document.referrer;
            } else {
                window.location.href = 'dashboard.html';
            }
        }

        const storedUser = localStorage.getItem('fitsyncUser');
        let currentUser = null;
        try { currentUser = storedUser ? JSON.parse(storedUser) : null; } catch(e) {}

        document.getElementById('logoutBtn')?.addEventListener('click', () => {
            localStorage.removeItem('fitsyncUser');
            window.location.href = 'index.html';
        });
        const adminNav = document.getElementById('adminNavLink');
        if (adminNav && currentUser?.role === 'Admin') adminNav.style.display = 'inline-block';

        const specialtySkillMap = {
            "Strength Training": ["Powerlifting", "Compound Lifts", "Progressive Overload", "Form & Technique", "Muscle Building"],
            "Yoga": ["Vinyasa Flow", "Flexibility", "Mindful Movement", "Pranayama", "Pilates Fusion"],
            "HIIT": ["Interval Training", "Fat Burn", "Agility Drills", "Metabolic Conditioning", "Tabata"],
            "Cardio": ["Endurance Running", "Spin Cycling", "Aerobics", "Heart Rate Training", "Stamina"],
            "Boxing": ["Footwork", "Combinations", "Speed Bag", "Sparring", "Conditioning"],
            "Pilates": ["Core Stability", "Pelvic Alignment", "Posture", "Mat Work", "Breathwork"]
        };
        const trainerAvatars = {
            1: "https://images.unsplash.com/photo-1567013127542-490d757e51fc?auto=format&fit=crop&w=400&q=80",
            2: "https://images.unsplash.com/photo-1594381898411-846e7d193883?auto=format&fit=crop&w=400&q=80",
            3: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80",
            4: "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=400&q=80"
        };

        async function loadTrainerProfile() {
            const trainerId = parseInt(new URLSearchParams(window.location.search).get('id'));
            if (!trainerId) {
                document.getElementById('profileContent').innerHTML = '<div class="profile-loading">No trainer specified. <a href="dashboard.html" style="color:#06b6d4;">Go to Dashboard</a></div>';
                return;
            }
            try {
                const [trainerRes, slotsRes] = await Promise.all([
                    fetch('/api/trainer'),
                    fetch('/api/trainer/' + trainerId + '/slots')
                ]);
                const allTrainers = await trainerRes.json();
                const trainer = allTrainers.find(t => t.trainerId === trainerId);
                if (!trainer) {
                    document.getElementById('profileContent').innerHTML = '<div class="profile-loading">Trainer not found. <a href="dashboard.html" style="color:#06b6d4;">Go to Dashboard</a></div>';
                    return;
                }
                let slots = [];
                try { slots = await slotsRes.json(); } catch(e) {}

                const avatarUrl = trainer.profilePhoto || trainerAvatars[trainer.trainerId] || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80';
                const skills = specialtySkillMap[trainer.specialization] || ["Fitness", "Training", "Coaching"];
                const rating = trainer.rating || 4.5;
                const reviews = trainer.totalReviews || 0;
                const fullStars = Math.floor(rating);
                const halfStar = rating - fullStars >= 0.5 ? '½' : '';
                const emptyStars = 5 - fullStars - (halfStar ? 1 : 0);
                const starsHtml = '★'.repeat(fullStars) + halfStar + '☆'.repeat(emptyStars);

                const slotsHtml = slots.length === 0
                    ? '<p style="color:rgba(240,246,252,0.4); font-size:13px;">No open slots at the moment. Check back soon!</p>'
                    : slots.map(s => {
                        const dateStr = new Date(s.slotDate).toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });
                        return '<div class="slot-row"><div class="slot-info">📅 <strong>' + dateStr + '</strong> &bull; 🕐 ' + s.startTime.slice(0,5) + ' – ' + s.endTime.slice(0,5) + ' &bull; ' + s.trainingType + '</div><button class="book-from-profile-btn" onclick="bookSlotFromProfile(' + s.slotId + ')">Book Slot</button></div>';
                    }).join('');

                document.getElementById('profileContent').innerHTML =
                    '<div class="trainer-hero">' +
                        '<img src="' + avatarUrl + '" alt="' + trainer.fullName + '" class="trainer-hero-avatar" loading="lazy">' +
                        '<div class="trainer-hero-info">' +
                            '<h1>' + trainer.fullName + '</h1>' +
                            '<div class="trainer-spec-badge">🎯 ' + trainer.specialization + '</div>' +
                            '<div style="display:flex;align-items:center;gap:6px;margin-bottom:12px;">' +
                                '<span style="color:#f59e0b;font-size:16px;letter-spacing:2px;">' + starsHtml + '</span>' +
                                '<span style="color:#f0f6fc;font-weight:700;font-size:14px;">' + rating.toFixed(1) + '</span>' +
                                '<span style="color:rgba(240,246,252,0.45);font-size:12px;">(' + reviews + ' reviews)</span>' +
                            '</div>' +
                            '<div class="trainer-meta-row">' +
                                '<div class="trainer-meta-item">⚡ <strong>' + trainer.experienceYears + '</strong>&nbsp;Years Experience</div>' +
                                '<div class="trainer-meta-item">✅ <strong>Certified</strong>&nbsp;Professional</div>' +
                                '<div class="trainer-meta-item">📧 ' + trainer.email + '</div>' +
                            '</div>' +
                            '<p class="trainer-bio-text">' + (trainer.bio || 'Expert trainer dedicated to helping you reach your fitness goals.') + '</p>' +
                        '</div>' +
                    '</div>' +
                    '<div class="info-card"><h2>📊 Trainer Stats</h2><div class="stats-row">' +
                        '<div class="stat-bubble"><span class="stat-val">' + trainer.experienceYears + '+</span><span class="stat-lbl">YEARS EXP</span></div>' +
                        '<div class="stat-bubble"><span class="stat-val">' + slots.length + '</span><span class="stat-lbl">OPEN SLOTS</span></div>' +
                        '<div class="stat-bubble"><span class="stat-val" style="color:#f59e0b;">' + rating.toFixed(1) + '★</span><span class="stat-lbl">RATING</span></div>' +
                        '<div class="stat-bubble"><span class="stat-val">' + reviews + '</span><span class="stat-lbl">REVIEWS</span></div>' +
                        '<div class="stat-bubble"><span class="stat-val">' + (trainer.experienceYears * 12) + '+</span><span class="stat-lbl">CLIENTS</span></div>' +
                    '</div></div>' +
                    '<div class="info-card"><h2>🏅 Specialties & Skills</h2><div class="tags-row">' +
                        skills.map(s => '<span class="skill-tag">' + s + '</span>').join('') +
                        '<span class="skill-tag">' + trainer.specialization + '</span>' +
                    '</div></div>' +
                    '<div class="info-card"><h2>📅 Available Slots</h2>' + slotsHtml + '</div>';

            } catch(err) {
                console.error('Profile load error:', err);
                document.getElementById('profileContent').innerHTML = '<div class="profile-loading">Unable to load profile. <a href="dashboard.html" style="color:#06b6d4;">Go to Dashboard</a></div>';
            }
        }

        window.bookSlotFromProfile = async function(slotId) {
            if (!currentUser) { window.location.href = 'login.html'; return; }
            try {
                const res = await fetch('/api/booking', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: currentUser.id, slotId })
                });
                const data = await res.json();
                if (res.ok) {
                    if (typeof showToast === 'function') showToast('Slot booked successfully!', 'success');
                    loadTrainerProfile();
                } else {
                    if (typeof showToast === 'function') showToast(data.message || 'Booking failed.', 'error');
                }
            } catch(err) {
                if (typeof showToast === 'function') showToast('Server error.', 'error');
            }
        };

        loadTrainerProfile();
    </script>
</body>
</html>
